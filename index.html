<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.plot.ly/plotly-3.7.0.min.js"></script>
<style>
html,body{margin:0;padding:0;font-family:Arial,sans-serif;height:100%}
#plot{width:100%;height:calc(100vh - 62px)}
#controls{height:62px;display:flex;align-items:center;justify-content:center;gap:16px}
button{padding:8px 14px;font-size:15px}
#stage-control-label{max-width:60%;text-align:center;font-weight:600}
</style>
</head>
<body>
<div id="plot"></div>
<div id="controls">
<button id="previous">◀ Previous</button>
<span id="stage-control-label">Loading…</span>
<button id="next">Next ▶</button>
</div>
<script src="js/simulator.js"></script>
</body>
</html>
