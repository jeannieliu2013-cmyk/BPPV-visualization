<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epley Maneuver Simulation</title>
<style>
html,body{height:100%;margin:0}
#plot{height:100%;width:100%}
#controls{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
z-index:10;text-align:center;background:rgba(255,255,255,.85);
padding:4px 10px;border-radius:6px}
button{margin:5px;padding:8px 16px}
#stage-control-label{margin:10px;font-weight:bold}
</style>
</head>
<body>
<div id="plot"></div>
<div id="controls">
<button id="previous">◀ Previous</button>
<span id="stage-control-label">Stage 1 / 5</span>
<button id="next">Next ▶</button>
</div>
<script src="https://cdn.plot.ly/plotly-3.7.0.min.js"></script>
<script src="js/simulator.js"></script>
</body>
</html>
